##############################################################################
# .github/workflows/ci.yml
# CI pipeline: Terraform lint/validate/checkov + Go vet/test.
##############################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"
  GO_VERSION: "1.22"

jobs:
  # ── Terraform: Format, Validate, tflint ─────────────────────────────────────
  terraform-lint:
    name: Terraform Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Validate Root Module
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: tf

      - name: Validate All Modules
        run: |
          for module in modules/*/; do
            echo "=== Validating $module ==="
            cd "$module"
            terraform init -backend=false 2>/dev/null || true
            terraform validate
            cd -
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint — Root Module
        run: |
          tflint --init
          tflint --chdir=tf

      - name: tflint — All Modules
        run: |
          for module in modules/*/; do
            echo "=== tflint $module ==="
            tflint --chdir="$module" || true
          done

  # ── Security: checkov ────────────────────────────────────────────────────────
  checkov:
    name: Checkov Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          skip_check: >-
            CKV_AWS_79,
            CKV2_AWS_38,
            CKV2_AWS_39

  # ── Go: vet, gosec, unit tests ────────────────────────────────────────────────
  go-test:
    name: Go Vet & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      - name: Download Dependencies
        run: go mod download
        working-directory: test

      - name: go vet
        run: go vet ./...
        working-directory: test

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Run Unit Tests
        run: go test -v -count=1 -timeout 15m -run TestUnit ./...
        working-directory: test
        env:
          TF_IN_AUTOMATION: "true"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test/testdata/

  # ── golangci-lint ────────────────────────────────────────────────────────────
  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61
          working-directory: test
          args: --config .golangci.yml --timeout 5m
