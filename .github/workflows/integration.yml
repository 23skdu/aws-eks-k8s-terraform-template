##############################################################################
# .github/workflows/integration.yml
# Integration tests — runs on demand (workflow_dispatch) or nightly.
# Requires AWS credentials stored as repository secrets.
##############################################################################

name: Integration Tests

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS region to deploy into"
        required: false
        default: "us-east-1"
  schedule:
    # Nightly at 02:00 UTC on weekdays
    - cron: "0 2 * * 1-5"

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"
  # Must satisfy the `go` directive in test/go.mod.
  GO_VERSION: "1.26"

jobs:
  integration:
    name: Integration — Deploy & Destroy
    runs-on: ubuntu-latest
    # NOTE: Create an 'integration' GitHub environment with AWS secrets
    # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in your repository settings
    # before enabling this workflow.
    # environment: integration  # uncomment once the environment is configured

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: test/go.sum

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws_region || 'us-east-1' }}

      - name: Download Go Dependencies
        run: go mod download
        working-directory: test

      - name: Run Integration Tests
        run: go test -v -count=1 -timeout 90m -run TestIntegration ./...
        working-directory: test
        env:
          TF_IN_AUTOMATION: "true"
          AWS_DEFAULT_REGION: ${{ inputs.aws_region || 'us-east-1' }}
